services:
  backend:
    #build: ./backend
    image: zzz6839/animefan-monitor2-backend:main
    ports:
      - "58000:58000"
    volumes:
      - .backend_data:/app/data
    restart: unless-stopped

  frontend:
    #build: ./frontend
    image: zzz6839/animefan-monitor2-frontend:main
    ports:
      - "53000:53000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
