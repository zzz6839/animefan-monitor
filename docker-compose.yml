version: '3.8'

services:
  backend:
    #build: ./backend
    image: zzz6839/animefan-monitor-backend:latest
    ports:
      - "58000:58000"
    volumes:
      - ./backend_data:/app/data
    restart: unless-stopped

  frontend:
    #build: ./frontend
    image: zzz6839/animefan-monitor-frontend:latest
    ports:
      - "53000:53000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
